# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

## Environment Properties
# Latest stable NeoForge for 1.21.11 at the time of writing (maven.neoforged.net)
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.48
neo_version_range=[21.11.0,)

## Mod Properties
mod_id=structurecompass
mod_name=Structure Compass
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.alien2003.structurecompass
mod_authors=alien2003
mod_description=Shows the nearest structures of every type (vanilla, datapacks and other mods): HUD list, compass bar, in-world beacons and bounding boxes, and a searchable structure screen.
mod_url=https://github.com/alien2003/structure-compass
