name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build and unit tests
        run: ./gradlew build

      - name: Run GameTests (headless game test server)
        run: ./gradlew runGameTestServer

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: structurecompass-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            run/gametest/logs/
          if-no-files-found: ignore

  # Builds a fresh clone exactly like a developer would: ./dev bootstraps a project-local mise
  # (no mise on the runner's PATH is used), which installs Temurin 21 into .tools/ and runs the
  # Gradle wrapper with GRADLE_USER_HOME=.gradle-home. No caches: this is the "from scratch" check.
  dev-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Record home directory state
        run: |
          if command -v mise >/dev/null 2>&1; then echo "mise found at $(command -v mise); its data dirs are still redirected into .tools"; fi
          touch "$RUNNER_TEMP/stamp"
          sleep 1

      - name: ./dev build from a clean clone
        run: ./dev build

      - name: Check nothing was written to the home directory outside the checkout
        run: |
          # Everything under $HOME that changed during the build, except the runner's own work/log folders
          # (the checkout itself lives in $HOME/work).
          changed=$(find "$HOME" -mindepth 1 \( -path "$HOME/work" -o -path "$HOME/runners" -o -path "$HOME/actions-runner" \) -prune \
            -o -newer "$RUNNER_TEMP/stamp" -print 2>/dev/null || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::files outside the project were written during ./dev build"
            exit 1
          fi
          ls -la build/libs/
